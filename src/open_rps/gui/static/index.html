<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenRPS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231c5cab'/%3E%3Cpath d='M16 23v-8M10 12a8 8 0 0 1 12 0M7 9a12 12 0 0 1 18 0' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='14' r='2.4' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header id="menubar">
    <div class="brand"><span class="logo" aria-hidden="true"></span>OpenRPS <span id="version" class="muted"></span></div>
    <nav class="menus" aria-label="Menú principal">
      <div class="menu">
        <button class="menu-button" type="button">Archivo</button>
        <div class="menu-items" role="menu">
          <button data-action="new" role="menuitem">Nuevo proyecto</button>
          <button data-action="open" role="menuitem">Abrir… <kbd>Ctrl+O</kbd></button>
          <button data-action="save" role="menuitem">Guardar <kbd>Ctrl+S</kbd></button>
          <hr>
          <div class="menu-label">Ejemplos</div>
          <div id="examples-menu"></div>
        </div>
      </div>
      <div class="menu">
        <button class="menu-button" type="button">Editar</button>
        <div class="menu-items" role="menu">
          <button data-action="undo" role="menuitem">Deshacer <kbd>Ctrl+Z</kbd></button>
          <button data-action="redo" role="menuitem">Rehacer <kbd>Ctrl+Y</kbd></button>
          <hr>
          <button data-action="duplicate" role="menuitem">Duplicar selección <kbd>Ctrl+D</kbd></button>
          <button data-action="delete" role="menuitem">Eliminar selección <kbd>Supr</kbd></button>
        </div>
      </div>
      <div class="menu">
        <button class="menu-button" type="button">Ver</button>
        <div class="menu-items" role="menu">
          <button data-action="view-2d" role="menuitem">Vista 2D <kbd>1</kbd></button>
          <button data-action="view-3d" role="menuitem">Vista 3D <kbd>2</kbd></button>
          <button data-action="view-split" role="menuitem">2D + 3D <kbd>3</kbd></button>
          <hr>
          <button data-action="fit" role="menuitem">Ajustar al área <kbd>F</kbd></button>
          <label class="menu-check"><input type="checkbox" id="opt-grid" checked> Cuadrícula</label>
          <label class="menu-check"><input type="checkbox" id="opt-snap" checked> Ajustar a la cuadrícula (1 m)</label>
          <label class="menu-check"><input type="checkbox" id="opt-smooth"> Mapa suavizado</label>
          <label class="menu-check"><input type="checkbox" id="opt-labels" checked> Nombres en el mapa</label>
          <hr>
          <div class="menu-label">Vista 3D</div>
          <label class="menu-check"><input type="checkbox" id="opt-relief"> Relieve de la cobertura</label>
          <label class="menu-check"><input type="checkbox" id="opt-transparent"> Edificios transparentes</label>
          <label class="menu-check"><input type="checkbox" id="opt-blocked" checked> Mostrar rayos bloqueados</label>
        </div>
      </div>
      <div class="menu">
        <button class="menu-button" type="button">Simulación</button>
        <div class="menu-items" role="menu">
          <button data-action="run" role="menuitem">Ejecutar predicción <kbd>F5</kbd></button>
          <button data-action="select-area" role="menuitem">Área de predicción…</button>
          <button data-action="select-settings" role="menuitem">Configuración…</button>
          <hr>
          <div class="menu-label">Exportar resultado</div>
          <button data-action="export-csv" role="menuitem">Tabla CSV</button>
          <button data-action="export-json" role="menuitem">Resumen JSON</button>
          <button data-action="export-svg" role="menuitem">Mapa SVG (métrica actual)</button>
          <button data-action="export-png" role="menuitem">Imagen PNG de la vista</button>
        </div>
      </div>
      <div class="menu">
        <button class="menu-button" type="button">Ayuda</button>
        <div class="menu-items" role="menu">
          <button data-action="help" role="menuitem">Atajos y uso</button>
          <button data-action="about" role="menuitem">Acerca de OpenRPS</button>
        </div>
      </div>
    </nav>
    <div id="project-title" class="project-title"></div>
  </header>

  <div id="toolbar" role="toolbar" aria-label="Herramientas">
    <div class="tool-group" id="tools">
      <button class="tool" data-tool="select" title="Seleccionar y mover (V)">Seleccionar</button>
      <button class="tool" data-tool="pan" title="Desplazar la vista (H)">Mano</button>
      <button class="tool" data-tool="tx" title="Colocar transmisor (T)">Transmisor</button>
      <button class="tool" data-tool="rect" title="Edificio rectangular: arrastra (R)">Edificio ▭</button>
      <button class="tool" data-tool="poly" title="Edificio poligonal: clic en cada vértice, doble clic para cerrar (P)">Edificio ⬠</button>
      <button class="tool" data-tool="wall" title="Muro: clic en el inicio y en el final (W)">Muro</button>
      <button class="tool" data-tool="probe" title="Receptor de prueba: rayos y respuesta al impulso (S)">Receptor</button>
      <button class="tool" data-tool="measure" title="Medir distancia (M)">Medir</button>
    </div>
    <div class="tool-group">
      <button id="run-button" class="primary" data-action="run" title="Ejecutar la predicción (F5)">▶ Ejecutar</button>
      <span id="outdated-badge" class="badge" hidden>Resultados desactualizados</span>
    </div>
    <div class="tool-group">
      <label>Mapa
        <select id="metric-select"></select>
      </label>
      <label>Tx
        <select id="tx-filter"></select>
      </label>
      <label title="Opacidad del mapa de cobertura">Opacidad
        <input type="range" id="opacity" min="0" max="1" step="0.05" value="0.85">
      </label>
    </div>
    <div class="tool-group" id="range-group">
      <label class="inline-check"><input type="checkbox" id="range-auto" checked> Escala auto</label>
      <input type="number" id="range-min" class="narrow" step="any" aria-label="Mínimo de la escala" disabled>
      <span class="muted">a</span>
      <input type="number" id="range-max" class="narrow" step="any" aria-label="Máximo de la escala" disabled>
    </div>
    <div class="tool-group view-switch" role="group" aria-label="Vista">
      <button data-action="view-2d" data-view="2d">2D</button>
      <button data-action="view-3d" data-view="3d">3D</button>
      <button data-action="view-split" data-view="split">2D+3D</button>
    </div>
  </div>

  <aside id="tree-panel" aria-label="Proyecto">
    <div class="panel-title">Proyecto</div>
    <div id="tree"></div>
  </aside>

  <main id="viewports" class="view-2d">
    <section id="view2d" class="viewport" aria-label="Vista 2D">
      <canvas id="canvas2d"></canvas>
      <div class="legend" id="legend2d"></div>
      <div class="hint" id="tool-hint"></div>
      <div class="tooltip" id="tooltip2d" hidden></div>
    </section>
    <section id="view3d" class="viewport" aria-label="Vista 3D">
      <canvas id="canvas3d"></canvas>
      <div class="view3d-controls">
        <button data-action="cam-top" title="Vista desde arriba">Planta</button>
        <button data-action="cam-persp" title="Vista en perspectiva">Perspectiva</button>
        <button data-action="cam-probe" title="Centrar en el receptor">Receptor</button>
      </div>
      <div class="legend" id="legend3d"></div>
      <div class="hint" id="hint3d">Arrastra para girar · botón derecho para desplazar · rueda para acercar</div>
      <div class="webgl-error" id="webgl-error" hidden>Este navegador no puede mostrar la vista 3D (WebGL no disponible).</div>
    </section>
    <div id="busy" class="busy" hidden><div class="spinner"></div><span id="busy-text">Simulando…</span></div>
  </main>

  <aside id="props-panel" aria-label="Propiedades">
    <div class="panel-title" id="props-title">Propiedades</div>
    <div id="props"></div>
  </aside>

  <section id="bottom-panel">
    <div class="resize-handle" id="bottom-resize" title="Arrastra para cambiar la altura del panel"></div>
    <div class="tabs" role="tablist">
      <button class="tab active" data-tab="probe" role="tab">Receptor · respuesta al impulso</button>
      <button class="tab" data-tab="stats" role="tab">Estadísticas</button>
      <button class="tab" data-tab="log" role="tab">Mensajes <span id="log-count" class="count" hidden></span></button>
      <button class="tab-toggle" id="bottom-toggle" title="Mostrar u ocultar el panel">▾</button>
    </div>
    <div class="tab-body" data-body="probe" id="probe-body"></div>
    <div class="tab-body" data-body="stats" id="stats-body" hidden></div>
    <div class="tab-body" data-body="log" id="log-body" hidden></div>
  </section>

  <footer id="statusbar">
    <span id="status-cursor">x, y: —</span>
    <span id="status-value"></span>
    <span class="spacer"></span>
    <span id="status-grid"></span>
    <span id="status-run"></span>
  </footer>
</div>

<div id="modal" class="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-title" id="modal-title"></div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-actions"><button id="modal-close" class="primary">Cerrar</button></div>
  </div>
</div>
<input type="file" id="file-input" accept=".json,application/json" hidden>
<script type="module" src="js/main.js"></script>
</body>
</html>
